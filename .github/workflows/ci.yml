name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned instead of ubuntu-latest: that label is scheduled to move to
    # Ubuntu 26, which would silently change the PostgreSQL version underneath
    # us (our schema needs >= 15 for `security_invoker` views).
    runs-on: ubuntu-24.04
    strategy:
      # One interpreter failing must not cancel the others: the point of the
      # matrix is to find WHICH version broke.
      fail-fast: false
      matrix:
        # pyproject claims >=3.11, so every version in that claim gets run.
        # Testing only the oldest is an untested promise for the rest.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PostgreSQL is installed HERE rather than via a `services:` container.
      # A service container pulls its image from Docker Hub on every run, and
      # hosted runners are routinely rate-limited as anonymous pullers: this
      # job died at "Initialize containers" with
      #   "Docker pull failed with exit code 1, back off 9.18 seconds ..."
      # before a single line of our own code executed. The distro package has
      # no such external dependency. (The alternative — keeping the container
      # and authenticating with DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets —
      # trades this failure mode for a credential to rotate.)
      - name: Start PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          sudo service postgresql start
          # The cluster authenticates the local socket by peer (hence
          # `sudo -u postgres`), but our DSNs connect over TCP, so the
          # superuser needs a password.
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER USER postgres PASSWORD 'ci-superuser-secret';"
          sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'agent_auth'" \
            | grep -q 1 \
            || sudo -u postgres psql -c "CREATE DATABASE agent_auth;"
          # Fail here, loudly, rather than inside the test run.
          PGPASSWORD=ci-superuser-secret psql -h localhost -U postgres \
            -d agent_auth -c "SELECT version();"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Apply database schema
        env:
          PGPASSWORD: ci-superuser-secret
        run: psql -h localhost -U postgres -d agent_auth -v ON_ERROR_STOP=1 -f aguard/db/schema.sql

      - name: Run tests
        env:
          # Non-default secrets even in CI — we never exercise dev defaults
          # as if they were fine.
          PG_SUPERUSER_PASSWORD: ci-superuser-secret
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-session-secret-not-for-prod' }}
          LOG_HASH_PEPPER: ci-pepper-not-for-prod
        run: pytest -q

      # A missing data file only surfaces AFTER install (agctl init would fail
      # for a user), so the wheel is verified here rather than discovered later.
      - name: Build and verify the distribution
        run: |
          python -m build --wheel --outdir dist
          python -c "import zipfile,glob;z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]);n=z.namelist();assert any(p.endswith('db/schema.sql') for p in n),'schema.sql missing from wheel';assert any(p.endswith('entry_points.txt') for p in n),'entry point missing';print('wheel ok')"

  # The image and the compose stack are deployment surfaces nothing else
  # exercises. A wrong install ordering (source copied AFTER the package is
  # installed) builds green and produces a container that dies on the first
  # `import aguard`, so building the image is not enough — this job also
  # proves the package imports and the server serves from inside it.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t a-guard:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name aguard-smoke -p 8080:8000 a-guard:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          echo "healthz: $(curl -fsS http://127.0.0.1:8080/healthz)"

          # The exact failure this job exists for: the installed artifact must
          # really contain the package, not just build successfully.
          docker exec aguard-smoke python -c "import aguard, aguard.main; print('imported', aguard.__file__)"

          # /readyz inspects dependencies, so with no database it must answer
          # 503. A probe that reported "ok" here would be worse than none.
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)
          echo "readyz: $code"
          [ "$code" = "503" ] || { echo "expected 503 without a database, got $code"; exit 1; }

      - name: Container logs
        if: failure()
        run: docker logs aguard-smoke

      - name: Stop the container
        if: always()
        run: docker rm -f aguard-smoke || true

  # Static gates, deliberately in their own job: they fail for a different
  # reason than a red test, and separating them keeps that obvious at a glance.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # The gate that found a real defect the moment it was switched on:
      # a 'next' route parameter shadowing builtin next(), and a list logging
      # argument that silently destroyed the log record.
      - name: Types (mypy)
        run: mypy

      # Scoped to THIS project's dependencies (pip-audit .), not the whole
      # interpreter environment: an environment audit also reports the build
      # tooling bundled with the interpreter (pip, setuptools), which we do not
      # ship and cannot fix from here — noise at best, a false gate at worst.
      - name: Vulnerable dependencies (pip-audit)
        run: pip-audit .

