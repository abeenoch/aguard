[project]
name = "a-guard"
version = "0.1.0"
description = "The security layer for AI agents: OIDC identity, PII-redacting logs, and database-enforced permissions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "abeenoch" }]
requires-python = ">=3.11"
keywords = ["oauth2", "oidc", "ai-agents", "pii-redaction", "security", "mcp", "rbac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyjwt",
    "cryptography",
    "psycopg[binary]",
    "psycopg-pool",
    "python-multipart",
    "mcp>=1.19.0,<2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "build", "twine"]

[project.scripts]
agctl = "aguard.cli:main"

[project.urls]
Homepage = "https://github.com/abeenoch/aguard"
Repository = "https://github.com/abeenoch/aguard"
Issues = "https://github.com/abeenoch/aguard/issues"

[build-system]
# >=77 is where setuptools implements PEP 639 (SPDX `license = "Apache-2.0"`
# and `license-files`). Older setuptools validates `project.license` against the
# pre-639 schema and rejects the string form outright.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aguard*"]

[tool.setuptools.package-data]
# The DB schema must ship INSIDE the wheel: `agctl init` applies it, and an
# installed package has no source checkout to read it from. The key MUST be
# quoted — unquoted, TOML reads `aguard.db` as a nested table.
"aguard.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

